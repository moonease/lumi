<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="white"/>
  <!-- Treasure shelf -->
  <rect x="100" y="100" width="200" height="50" rx="10" ry="10" fill="#8B4513" stroke="black" stroke-width="8" stroke-linecap="round"/>
  <!-- Twig -->
  <path d="M120,120 C130,110 140,125 150,130 C160,135 170,140 180,135" fill="none" stroke="#8B4513" stroke-width="10" stroke-linecap="round"/>
  <!-- Leaf -->
  <circle cx="170" cy="130" r="20" fill="#228B22" stroke="black" stroke-width="6" stroke-linecap="round"/>
  <!-- Hedge -->
  <ellipse cx="80" cy="180" rx="30" ry="20" fill="#228B22" stroke="black" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="320" cy="180" rx="30" ry="20" fill="#228B22" stroke="black" stroke-width="6" stroke-linecap="round"/>
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#FFD700" stroke="black" stroke-width="6" stroke-linecap="round"/>
  <circle cx="340" cy="55" r="5" fill="black"/>
  <circle cx="360" cy="55" r="5" fill="black"/>
  <path d="M350,80 Q340,90 350,100" fill="none" stroke="black" stroke-width="6" stroke-linecap="round"/>
  <!-- Name LUMI -->
  <path d="M100,250 Q120,240 140,250" fill="none" stroke="black" stroke-width="8" stroke-linecap="round"/>
  <path d="M140,250 Q160,240 180,250" fill="none" stroke="black" stroke-width="8" stroke-linecap="round"/>
  <path d="M180,250 Q200,240 220,250" fill="none" stroke="black" stroke-width="8" stroke-linecap="round"/>
  <path d="M220,250 Q240,240 260,250" fill="none" stroke="black" stroke-width="8" stroke-linecap="round"/>
</svg>