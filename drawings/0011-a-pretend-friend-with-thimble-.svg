<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="white"/>
  <rect y="0" width="400" height="100" fill="skyblue"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="green" stroke-width="10" stroke-linecap="round"/>
  <!-- Teapot house -->
  <circle cx="200" cy="180" r="60" fill="saddlebrown" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="100" r="10" fill="saddlebrown" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M160,180 Q180,150 200,180" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M240,180 Q220,150 200,180" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Friend with thimble hat and cloak -->
  <circle cx="200" cy="120" r="30" fill="lightblue" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="80" r="15" fill="white" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M170,80 Q200,50 230,80" fill="white" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M170,110 Q200,140 230,110" fill="lightgray" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Flowers/trees -->
  <circle cx="100" cy="230" r="10" fill="green" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="210" r="5" fill="yellow" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="230" r="10" fill="green" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="210" r="5" fill="yellow" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <!-- LUMI text -->
  <path d="M50,200 C60,180 80,170 100,180 C120,190 140,210 150,200" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M160,200 C170,180 190,170 210,180 C230,190 250,210 260,200" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M270,200 C280,180 300,170 320,180 C340,190 360,210 370,200" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
</svg>